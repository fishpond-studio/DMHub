services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_TYPE=${DB_TYPE:-postgresql}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dmhub:dmhub@postgres:5432/dmhub}
      # TABLE_PREFIX 已废弃，保留兼容
      - TABLE_PREFIX=${TABLE_PREFIX:-}
      - REDIS_URL=${REDIS_URL:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmhub}
      POSTGRES_DB: ${POSTGRES_DB:-dmhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-dmhub.example.com}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
